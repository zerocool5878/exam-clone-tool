name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
    
    - name: Extract version
      id: version
      run: |
        $content = Get-Content exam_clone_tool_v2.py -Raw
        $version = ($content | Select-String 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "EXE_NAME=Exam_Clone_Tool_v$version" >> $env:GITHUB_OUTPUT
    
    - name: Build executable
      # Keep this flag list in sync with build_release.py so the CI exe bundles
      # everything the browser-capture and auto-update features need.
      run: |
        pyinstaller --onefile --windowed --name "${{ steps.version.outputs.EXE_NAME }}" --icon=test_icon.ico `
          --add-data "auto_updater.py;." `
          --hidden-import win32gui --hidden-import win32con --hidden-import win32clipboard `
          --hidden-import win32api --hidden-import pywintypes --hidden-import pythoncom `
          --hidden-import pyautogui --hidden-import pyscreeze --hidden-import pygetwindow `
          --hidden-import pymsgbox --hidden-import pytweening --hidden-import mouseinfo `
          --hidden-import PIL --hidden-import PIL._tkinter_finder `
          --hidden-import requests --hidden-import urllib3 --hidden-import certifi `
          --hidden-import charset_normalizer --hidden-import idna `
          --collect-all win32 --collect-all pywin32 --collect-all pyautogui `
          exam_clone_tool_v2.py
        if (-not (Test-Path "dist/${{ steps.version.outputs.EXE_NAME }}.exe")) { throw "Executable was not produced" }
    
    - name: Create release notes
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $versionNotes = "releases/RELEASE_NOTES_v$version.md"
        if (Test-Path $versionNotes) {
          Copy-Item $versionNotes "RELEASE_NOTES.md"
          Write-Host "Using version-specific notes from $versionNotes"
          exit 0
        }
        $releaseNotes = @"
        # Exam Clone Tool v$version
        
        ## Features
        - 🔍 Compare exam files and identify question ID mappings
        - 🔄 Automatic conflict resolution for duplicate assignments  
        - 📊 Detailed mapping reports with success statistics
        - ⚡ Auto-update system with GitHub integration
        - 🎯 Support for both normal target and comprehensive test files
        
        ## Installation
        1. Download the .exe file below
        2. Run directly - no installation required
        3. The tool will automatically check for updates on startup
        
        ## System Requirements
        - Windows 10 or later
        - Internet connection (for updates)
        
        Built with Python 🐍 | Auto-updates via GitHub 🚀
        "@
        
        $releaseNotes | Out-File -FilePath "RELEASE_NOTES.md" -Encoding UTF8
    
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: Exam Clone Tool v${{ steps.version.outputs.VERSION }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
        files: ./dist/${{ steps.version.outputs.EXE_NAME }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}